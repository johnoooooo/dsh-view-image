# dsh-view-image bundle patch.
#
# Mounts the view_image tool plugin. When this package is listed in a
# profile's dsh.profile.bundles (package.json -> dsh.profile.bundles), this
# patch applies automatically. Alternatively, copy the row below into the
# profile's own cordis.patch.yml (the package must then be installed into the
# profile, e.g. `dsh plugin --profile <name> add file:<path>`).
#
# The vision model is NOT configured here — it lives in
# $DSH_HOME/vision-model.json (see vision-model.example.opencode.json).
#
# defaultPrompt: 主模型未传 intent 时原样发给视觉模型的提示词（不拼接任何后缀；可在 profile 层覆盖）。
- insert:
    - id: view-image
      name: 'dsh-view-image'
      config:
        defaultPrompt: '完整描述图片中所有内容，包括所有文字、图形和布局结构。用中文回答。'